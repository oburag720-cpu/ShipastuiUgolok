<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шипастый уголок</title>

  <style>
    :root {
      --panel: #1c2023;
      --text: #f4f1e8;
      --muted: #aeb5b1;
      --green: #8dbb72;
      --border: #343b3f;
      --danger: #d86b68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, #29392c 0, transparent 30%),
        linear-gradient(135deg, #101211, #1b211d);
    }

    header {
      padding: 48px 20px 35px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 1px;
    }

    header p {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
      line-height: 1.6;
    }

    main {
      width: min(1180px, 100% - 32px);
      margin: 30px auto 60px;
    }

    .upload-panel {
      padding: 24px;
      background: rgba(28, 32, 35, 0.95);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .upload-panel h2 {
      margin-top: 0;
    }

    form {
      display: grid;
      gap: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px 15px;
      color: var(--text);
      background: #121516;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--green);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      padding: 13px 20px;
      color: #101510;
      background: var(--green);
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #a4d388;
      transform: translateY(-1px);
    }

    .gallery-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 42px 0 18px;
    }

    .gallery-heading h2 {
      margin: 0;
    }

    .gallery-heading span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    .card-image-wrapper {
      padding: 8px;
      background: #0c0e0e;
    }

    .card img {
      display: block;
      width: 100%;
      height: 230px;
      object-fit: cover;
      cursor: zoom-in;
      transition: 0.25s;
    }

    .card img:hover {
      opacity: 0.82;
      transform: scale(1.02);
    }

    /* Варианты обводки фотографии */
    .outline-none {
      border: 0;
    }

    .outline-green {
      border: 7px solid #8dbb72;
    }

    .outline-gold {
      border: 7px solid #d7ad55;
    }

    .outline-red {
      border: 7px solid #d86b68;
    }

    .outline-blue {
      border: 7px solid #6d9ed8;
    }

    .outline-purple {
      border: 7px solid #a878c5;
    }

    .card-content {
      padding: 16px;
    }

    .card h3 {
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    .card p {
      min-height: 22px;
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .date {
      margin-bottom: 14px;
      color: #7f8982;
      font-size: 0.82rem;
    }

    .delete-button {
      width: 100%;
      margin-top: 14px;
      padding: 9px;
      color: #fff;
      background: transparent;
      border: 1px solid var(--danger);
      font-size: 0.9rem;
    }

    .delete-button:hover {
      color: #fff;
      background: var(--danger);
    }

    .comments {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .comments h4 {
      margin: 0 0 12px;
    }

    .comment-list {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .comment {
      padding: 9px 10px;
      color: var(--text);
      background: #121516;
      border-radius: 8px;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .comment-author {
      display: block;
      margin-bottom: 4px;
      color: var(--green);
      font-size: 0.78rem;
    }

    .comment-form {
      display: flex;
      gap: 8px;
    }

    .comment-form input {
      min-width: 0;
      padding: 10px;
    }

    .comment-form button {
      flex-shrink: 0;
      padding: 10px 13px;
      font-size: 0.85rem;
    }

    .empty {
      padding: 45px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 15px;
    }

    footer {
      padding: 25px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }

    /* Окно просмотра фотографии */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: rgba(0, 0, 0, 0.88);
      cursor: zoom-out;
    }

    .modal.active {
      display: flex;
    }

    .modal-image {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
      cursor: default;
    }

    .close-modal {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 1001;
      width: 45px;
      height: 45px;
      padding: 0;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid #777;
      border-radius: 50%;
      font-size: 28px;
      line-height: 40px;
    }

    .close-modal:hover {
      background: var(--danger);
      transform: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>🌵 Шипастый уголок</h1>

    <p>
      Место, где сохраняются лучшие моменты Гимназии №1.
    </p>
  </header>

  <main>
    <section class="upload-panel">
      <h2>Добавить фотографию</h2>

      <form id="photoForm">
        <input
          id="title"
          type="text"
          placeholder="Название фотографии"
          maxlength="80"
          required
        >

        <textarea
          id="description"
          placeholder="Описание, автор или комментарий"
          maxlength="300"
        ></textarea>

        <label for="outline">
          Выберите обводку фотографии:
        </label>

        <select id="outline">
          <option value="outline-none">Без обводки</option>
          <option value="outline-green">Зелёная обводка</option>
          <option value="outline-gold">Золотая обводка</option>
          <option value="outline-red">Красная обводка</option>
          <option value="outline-blue">Синяя обводка</option>
          <option value="outline-purple">Фиолетовая обводка</option>
        </select>

        <input
          id="photo"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          required
        >

        <button type="submit">
          Загрузить фотографию
        </button>
      </form>
    </section>

    <div class="gallery-heading">
      <h2>Галерея</h2>
      <span id="photoCount">0 фотографий</span>
    </div>

    <section id="gallery" class="gallery"></section>
  </main>

  <footer>
    © 2026 «Шипастый уголок»
  </footer>

  <!-- Окно просмотра фотографии -->
  <div id="photoModal" class="modal">
    <button id="closeModal" class="close-modal" aria-label="Закрыть">
      ×
    </button>

    <img
      id="modalImage"
      class="modal-image"
      alt="Полный просмотр фотографии"
    >
  </div>

  <script>
    const STORAGE_KEY = "shipasty-ugolok-photos";

    const DELETE_PASSWORD = "KaktusZaxar17Shipov";

    const form = document.getElementById("photoForm");
    const gallery = document.getElementById("gallery");
    const photoCount = document.getElementById("photoCount");

    const photoModal = document.getElementById("photoModal");
    const modalImage = document.getElementById("modalImage");
    const closeModal = document.getElementById("closeModal");

    let photos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    function savePhotos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString("ru-RU", {
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPhotoWord(number) {
      const lastTwo = number % 100;
      const last = number % 10;

      if (lastTwo >= 11 && lastTwo <= 14) {
        return "фотографий";
      }

      if (last === 1) {
        return "фотография";
      }

      if (last >= 2 && last <= 4) {
        return "фотографии";
      }

      return "фотографий";
    }

    function renderGallery() {
      gallery.innerHTML = "";

      photoCount.textContent =
        `${photos.length} ${getPhotoWord(photos.length)}`;

      if (photos.length === 0) {
        gallery.innerHTML = `
          <div class="empty">
            Пока здесь нет фотографий. Загрузите первую!
          </div>
        `;

        return;
      }

      [...photos].reverse().forEach(photo => {
        const card = document.createElement("article");

        card.className = "card";

        const comments = photo.comments || [];

        const commentsHtml = comments.length > 0
          ? comments.map(comment => `
              <div class="comment">
                <span class="comment-author">
                  Анонимный пользователь
                </span>
                ${escapeHtml(comment.text)}
              </div>
            `).join("")
          : `
              <div class="comment">
                Комментариев пока нет.
              </div>
            `;

        card.innerHTML = `
          <div class="card-image-wrapper">
            <img
              src="${photo.image}"
              alt="${escapeHtml(photo.title)}"
              class="gallery-image ${photo.outline || "outline-none"}"
              data-image="${photo.image}"
            >
          </div>

          <div class="card-content">
            <h3>${escapeHtml(photo.title)}</h3>

            <p>
              ${escapeHtml(photo.description || "Без описания")}
            </p>

            <div class="date">
              ${formatDate(photo.createdAt)}
            </div>

            <section class="comments">
              <h4>Комментарии</h4>

              <div class="comment-list">
                ${commentsHtml}
              </div>

              <form class="comment-form" data-photo-id="${photo.id}">
                <input
                  type="text"
                  name="comment"
                  placeholder="Написать анонимный комментарий"
                  maxlength="250"
                  required
                >

                <button type="submit">
                  Отправить
                </button>
              </form>
            </section>

            <button
              class="delete-button"
              data-id="${photo.id}"
            >
              Удалить фотографию
            </button>
          </div>
        `;

        gallery.appendChild(card);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();

      const description = document
        .getElementById("description")
        .value
        .trim();

      const outline = document.getElementById("outline").value;
      const file = document.getElementById("photo").files[0];

      if (!file) {
        alert("Выберите фотографию.");
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        alert("Размер фотографии не должен превышать 5 МБ.");
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        const newPhoto = {
          id: crypto.randomUUID(),
          title: title,
          description: description,
          outline: outline,
          image: reader.result,
          comments: [],
          createdAt: new Date().toISOString()
        };

        photos.push(newPhoto);

        savePhotos();
        renderGallery();
        form.reset();

        alert("Фотография добавлена!");
      };

      reader.readAsDataURL(file);
    });

    gallery.addEventListener("click", event => {
      const clickedImage = event.target.closest(".gallery-image");

      if (clickedImage) {
        modalImage.src = clickedImage.dataset.image;
        photoModal.classList.add("active");
        document.body.style.overflow = "hidden";
        return;
      }

      const deleteButton = event.target.closest(".delete-button");

      if (deleteButton) {
        const password = prompt(
          "Введите пароль для удаления фотографии:"
        );

        if (password === null) {
          return;
        }

        if (password !== DELETE_PASSWORD) {
          alert("Неверный пароль.");
          return;
        }

        const id = deleteButton.dataset.id;

        if (confirm("Удалить эту фотографию?")) {
          photos = photos.filter(photo => photo.id !== id);

          savePhotos();
          renderGallery();
        }

        return;
      }

      const commentForm = event.target.closest(".comment-form");

      if (commentForm) {
        event.preventDefault();

        const photoId = commentForm.dataset.photoId;
        const commentInput = commentForm.querySelector(
          'input[name="comment"]'
        );

        const commentText = commentInput.value.trim();

        if (!commentText) {
          return;
        }

        const photo = photos.find(item => item.id === photoId);

        if (!photo) {
          return;
        }

        if (!photo.comments) {
          photo.comments = [];
        }

        photo.comments.push({
          id: crypto.randomUUID(),
          text: commentText,
          createdAt: new Date().toISOString()
        });

        savePhotos();
        renderGallery();
      }
    });

    function closePhotoModal() {
      photoModal.classList.remove("active");
      modalImage.src = "";
      document.body.style.overflow = "";
    }

    closeModal.addEventListener("click", closePhotoModal);

    photoModal.addEventListener("click", event => {
      if (event.target === photoModal) {
        closePhotoModal();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closePhotoModal();
      }
    });

    renderGallery();
  </script>
</body>
</html>
